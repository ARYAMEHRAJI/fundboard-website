name: FundBoard quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: PHP syntax checks
        run: |
          php -l index.php
          php -l api/index.php
          php -l config/config.example.php
      - name: JavaScript syntax check
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check assets/js/app.js
